# Builds the Windows installer and portable .exe and attaches them to a GitHub release.
#
# Runs automatically when `npm run release:linux` publishes a release from your machine.
# It can also be started by hand (Actions tab > Release Windows build > Run workflow)
# to rebuild the Windows files for an existing release tag.
name: Release Windows build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.0.2
        required: true

permissions:
  # Needed to upload files to the release
  contents: write

concurrency:
  group: release-windows-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # electron-builder uploads to the release named after package.json's version,
      # so a mismatch would publish to the wrong release
      - name: Check the tag matches package.json
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $expected"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Package and upload to the release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Allow re-running this job on a release published more than 2 hours ago
          EP_GH_IGNORE_TIME: true
