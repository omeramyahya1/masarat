# The only electron-builder config: keep package.json free of a "build" key,
# otherwise electron-builder reads that instead and ignores this file.
appId: com.masarat.alpha
productName: Masarat MVP
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!**/.github/*'
  - '!src/*'
  - '!drizzle/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!drizzle.config.ts'
  - '!scripts/*'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{CLAUDE.md,CLAUDE.local.md,prompt.txt}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Local development database
  - '!masarat.db*'
asarUnpack:
  - resources/**
# Migrations are applied on startup from <resources>/drizzle
extraResources:
  - from: drizzle
    to: drizzle
win:
  executableName: masarat
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${name}-${version}-portable.${ext}
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: omeramyahya1
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: omeramyahya1
  repo: masarat
  # Upload into the draft the release workflow creates; the workflow publishes it once both
  # the Linux and Windows files are attached (see .github/workflows/release.yml)
  releaseType: draft
